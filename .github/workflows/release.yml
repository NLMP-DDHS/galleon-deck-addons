# Publishes one add-on as its own download. Push a tag named <add-on>-v<version>,
# e.g. star-citizen-v1.0.0, and this builds star-citizen-1.0.0.tar.gz and attaches
# it to a GitHub release. The version must match the add-on's addon.toml.
name: Release an add-on
on:
  push:
    tags: ["*-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          tag="$GITHUB_REF_NAME"; name="${tag%-v*}"; ver="${tag##*-v}"
          test -f "$name/addon.toml" || { echo "::error::no add-on folder '$name'"; exit 1; }
          grep -qx "version = \"$ver\"" "$name/addon.toml" || { echo "::error::$name/addon.toml isn't version $ver"; exit 1; }
          title=$(sed -n 's/^title = "\(.*\)"$/\1/p' "$name/addon.toml")
          tar --exclude=__pycache__ --exclude='*.pyc' --owner=0 --group=0 --sort=name -czf "$name-$ver.tar.gz" "$name"
          {
            echo "**$title** add-on for [galleon-deck](https://github.com/NLMP-DDHS/galleon-deck) $(sed -n 's/^requires = "\([^"]*\)".*/\1/p' "$name/addon.toml")+."
            echo
            echo "Download \`$name-$ver.tar.gz\` below. Then, in the Galleon Deck app, open the **Add-ons** tab and"
            echo "click **Install from file…**, or run \`galleon-addon install ~/Downloads/$name-$ver.tar.gz\`."
            echo
            echo "See the [$name README](https://github.com/$GITHUB_REPOSITORY/tree/$tag/$name) for what's inside."
          } > notes.md
          echo "FILE=$name-$ver.tar.gz" >> "$GITHUB_ENV"
          echo "TITLE=$title $ver" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$FILE" --title "$TITLE" --notes-file notes.md
