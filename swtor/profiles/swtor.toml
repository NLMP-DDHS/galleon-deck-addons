# Star Wars: The Old Republic profile, from the swtor add-on for galleon-deck.
#
# The deck switches here by itself while the game window has focus (the
# auto_switch rule below), and back to your fallback profile when you leave it.
#
# SWTOR keeps your keybinds on its servers, so nothing on this machine can read
# them: these keys press the game's 7.x defaults. If you rebind something in
# game, change the key here to match - the add-on's README lists every default,
# and upgrading the add-on backs this file up first.
#
# Two things the game does NOT bind for you:
#   * Quickbars 2-6 have no keys at all out of the box. The "bar 2" and "bar 3"
#     pages ship dim for that reason, with the chords they expect written in.
#     Bind them in Preferences > Key Bindings > Quickbar, then run
#     `galleon-addon run swtor bars --bound 2,3` to light the pages up.
#   * The main bar's slots 11 and 12 are the unshifted `-` and `=` keys, so they
#     assume a US layout. On another layout, change them here.
#
# What the game does keep on disk is your interface layout, and the deck follows
# it: `galleon-addon run swtor bars` (or SYNC BARS on the "look" page) reads the
# GUI profile your character uses and dims every key whose quickbar is switched
# off or whose slot is past the end of the bar. Dim keys keep their binds.
#
# A dim key does nothing: either its quickbar isn't bound in game, or the slot
# isn't on your screen. The "look" page carries that mark as a legend.

theme = "swtor-holo"
start_page = "bar 1"
auto_switch = [
  # Under Proton the window is usually steam_app_1286830; a non-Steam install
  # reports swtor.exe. The launcher is left alone on purpose.
  { class = '(?i)^(swtor(\.exe)?|steam_app_1286830)$' },
]


[[page]]
name = "bar 1"
# The main quickbar: bound to 1-9, 0, - and = out of the box.
keys = [
  { label = "1", key = "1", swtor_bar = 1, swtor_slot = 1 },
  { label = "2", key = "2", swtor_bar = 1, swtor_slot = 2 },
  { label = "3", key = "3", swtor_bar = 1, swtor_slot = 3 },
  { label = "4", key = "4", swtor_bar = 1, swtor_slot = 4 },
  { label = "5", key = "5", swtor_bar = 1, swtor_slot = 5 },
  { label = "6", key = "6", swtor_bar = 1, swtor_slot = 6 },
  { label = "7", key = "7", swtor_bar = 1, swtor_slot = 7 },
  { label = "8", key = "8", swtor_bar = 1, swtor_slot = 8 },
  { label = "9", key = "9", swtor_bar = 1, swtor_slot = 9 },
  { label = "10", key = "0", swtor_bar = 1, swtor_slot = 10 },
  { label = "11", key = "MINUS", swtor_bar = 1, swtor_slot = 11 },
  { label = "12", key = "EQUAL", swtor_bar = 1, swtor_slot = 12 },
]

[[page]]
name = "bar 2"
# Quickbar 2. Bind each slot to Alt+<number> in game, then: bars --bound 2
keys = [
  { label = "1", keys = "LEFTALT+1", swtor_bar = 2, swtor_slot = 1, swtor_unbound = true, fg = "dim", swtor_off = true },
