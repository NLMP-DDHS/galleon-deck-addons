# Star Citizen profile, from the star-citizen add-on for galleon-deck.
#
# The deck switches here by itself while the game window has focus (the
# auto_switch rule below), and back to your fallback profile when you leave it.
#
# Keys press the game's keyboard binds from Star Citizen 4.x defaults. Each key
# names its game action in `sc_action`; `galleon-addon run star-citizen sync-binds`
# (or the SYNC key on the "look" page) re-reads your in-game keybinds and updates
# these keys to match, so rebinding in the game never leaves the deck behind.
# Keys drawn dim have no keyboard bind in the game yet: bind them in
# Options > Keybindings, then sync.
#
# A bright frame marks a hold action: keep the key down, as you would on the
# keyboard (quantum spool, autoland, ping, radial menus, power to max, ...).
# The "look" page carries both marks as a legend: two keys that do nothing but
# show what a hold key and an unbound key look like in the theme you picked.

theme = "sc-mobiglas"
start_page = "flight"
auto_switch = [
  { class = '(?i)^starcitizen(\.exe)?$' },
]

[[page]]
name = "flight"
keys = [
  { icon = "\U000F14DE", label = "READY", keys = "RIGHTALT+R", sc_action = "spaceship_general.v_flightready" },
  { icon = "\U000F0425", label = "POWER", key = "U", sc_action = "spaceship_power.v_power_toggle" },
  { icon = "\U000F1741", label = "QUANTUM", border = "accent", key = "B", sc_action = "spaceship_movement.v_master_mode_cycle_long" },
