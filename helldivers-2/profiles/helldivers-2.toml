# Helldivers 2: every stratagem, one key each. From the helldivers-2 add-on for galleon-deck.
#
# A key holds the stratagem menu (Left Ctrl) and taps the code on W A S D,
# the game's default binds (W up, S down, A left, D right). If you rebind the
# menu or the directions in game, change `hold` / the letters below to match.
# If the game drops inputs, raise step_ms (ms between taps; default 40).
#
# Key colours follow the game: red offensive, blue supply, green defensive,
# yellow mission. Turn the right dial for pages.

theme = "hd-super-earth"
start_page = "mission"
auto_switch = [
  # Under Proton the window is steam_app_553850.
  { class = '(?i)^(steam_app_553850|helldivers2(\.exe)?)$' },
]


[[page]]
name = "mission"
keys = [
  { label = "REINFORCE", icon = "󰀔", fg = "accent", hold = "CTRL", sequence = "W S D A W" },
  { label = "RESUPPLY", icon = "󰏗", fg = "accent", hold = "CTRL", sequence = "S S W D" },
  { label = "SOS", icon = "󰡾", fg = "accent", hold = "CTRL", sequence = "W S D W" },
  { label = "HELLBOMB", icon = "󰚑", fg = "accent", hold = "CTRL", sequence = "S W A S W D S W" },
  { label = "EAGLE REARM", icon = "󰀝", fg = "#ff5a3c", hold = "CTRL", sequence = "W W A W D" },
  { label = "SEAF ARTY", icon = "󰑱", fg = "#ff5a3c", hold = "CTRL", sequence = "D W W S" },
  { label = "FLAG", icon = "󰈻", fg = "accent", hold = "CTRL", sequence = "S W S W" },
  { label = "FLARE", icon = "󰑱", fg = "#ff5a3c", hold = "CTRL", sequence = "D D A A" },
  { label = "UPLOAD DATA", icon = "󰈻", fg = "accent", hold = "CTRL", sequence = "A D W W W" },
